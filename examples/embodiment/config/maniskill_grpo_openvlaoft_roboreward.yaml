# ManiSkill GRPO with OpenVLA-OFT actor and RoboReward video reward model.
#
# Notes:
# - The policy still acts from the standard ManiSkill observation stream.
# - The external reward worker receives terminal rollout videos plus task
#   descriptions gathered from the training env.
# - RoboReward-8B requires a Transformers build with Qwen3-VL support.

defaults:
  - env/maniskill_put_on_plate_in_scene_25_main@env.train
  - env/maniskill_ood_template@env.eval
  - model/openvla_oft@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0
    env: 0
    rollout: 0
    reward: 0

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "maniskill_grpo_openvlaoft_roboreward"
    logger_backends: ["wandb"]

  max_epochs: 3
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 1

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 8

  rollout_epoch: 1
  eval_rollout_epoch: 1

  reward_type: action_level
  logprob_type: token_level
  entropy_type: token_level

  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 0
    top_p: 1.0
    repetition_penalty: 1.0

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"

  train:
    total_num_envs: 32
    group_size: ${algorithm.group_size}
    max_episode_steps: 80
    max_steps_per_rollout_epoch: 80
    video_cfg:
      save_video: True
      info_on_video: True
      video_base_dir: ${runner.logger.log_path}/video/train

  eval:
    total_num_envs: 16
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 80
    max_steps_per_rollout_epoch: 80
    group_size: 1
    video_cfg:
      save_video: True
      info_on_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: "models/Openvla-oft-SFT-libero10-trajall/"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 8
  global_batch_size: 80
  seed: 1234
  enable_offload: True

  model:
    model_path: "models/Openvla-oft-SFT-libero10-trajall/"
    model_type: "openvla_oft"
    unnorm_key: bridge_orig
    is_lora: True
    lora_path: models/OpenVLAOFT-ManiSkill-Base-Lora
    max_prompt_length: 30

  optim:
    lr: 1.0e-4
    value_lr: 3.0e-3
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 10.0

  fsdp_config:
    strategy: "fsdp"
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: True
  group_name: "RewardGroup"
  enable_offload: True

  reward_mode: "terminal"
  reward_weight: 1.0
  env_reward_weight: 0.0

  model:
    model_type: "roboreward_qwen3vl"
    model_path: "models/RoboReward-8B"
    input_type: "video"
    precision: "bf16"
    trust_remote_code: True
    low_cpu_mem_usage: True
    attn_implementation: "flash_attention_2"
    max_frames: 8
    min_frames: 4
    sample_strategy: "uniform_keep_last"
    max_new_tokens: 16
    score_mapping: "normalized"

critic:
  use_critic_model: False
